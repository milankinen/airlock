name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ── Stage 1 ────────────────────────────────────────────
  lint-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install deps
        run: |
          rustup component add clippy
          rustup toolchain install nightly --component rustfmt
          brew install capnp
      - uses: Swatinem/rust-cache@v2
      - run: mise run lint

  lint-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq capnproto libcapnp-dev libclang-dev musl-tools
          rustup component add clippy
          rustup target add x86_64-unknown-linux-musl
          rustup toolchain install nightly --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: mise run lint

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install capnp
        run: brew install capnp
      - uses: Swatinem/rust-cache@v2
      - run: mise run test

  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq capnproto libcapnp-dev xvfb
      - uses: Swatinem/rust-cache@v2
      - run: mise run test
        env:
          # The dialog tests must run in CI, not skip.
          AIRLOCK_REQUIRE_XVFB: "1"

  build-manual:
    needs: [ lint-macos, lint-linux, test-macos, test-linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the last change date of each page
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: mise run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: manual
          path: target/manual

  # ── Stage 2: build artifacts ───────────────────────────
  build-kernel-aarch64:
    needs: [ lint-macos, lint-linux, test-macos, test-linux ]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        id: kernel-cache
        with:
          path: target/vm/Image
          key: kernel-aarch64-${{ hashFiles('app/vm-kernel/config-arm64', 'app/vm-kernel/build.sh') }}
      - if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: mise run build:kernel
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-aarch64
          path: target/vm/Image

  build-kernel-x86_64:
    needs: [ lint-macos, lint-linux, test-macos, test-linux ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        id: kernel-cache
        with:
          path: target/vm/Image
          key: kernel-x86_64-${{ hashFiles('app/vm-kernel/config-x86_64', 'app/vm-kernel/build.sh') }}
      - if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: mise run build:kernel
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-x86_64
          path: target/vm/Image

  build-initramfs-aarch64:
    needs: [ lint-macos, lint-linux, test-macos, test-linux ]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq capnproto libcapnp-dev musl-tools
          rustup target add aarch64-unknown-linux-musl
      - name: Build airlockd
        run: SUPERVISOR_BUILD_HOST=true mise run build:airlockd
      - run: mise run build:initramfs --no-deps
      - uses: actions/upload-artifact@v4
        with:
          name: initramfs-aarch64
          path: target/vm/initramfs.gz

  build-initramfs-x86_64:
    needs: [ lint-macos, lint-linux, test-macos, test-linux ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq capnproto libcapnp-dev musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Build airlockd
        run: SUPERVISOR_BUILD_HOST=true mise run build:airlockd
      - run: mise run build:initramfs --no-deps
      - uses: actions/upload-artifact@v4
        with:
          name: initramfs-x86_64
          path: target/vm/initramfs.gz

  fetch-vmm-x86_64:
    needs: [ lint-macos, lint-linux, test-macos, test-linux ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run fetch:cloud-hypervisor
      - run: mise run build:virtiofsd
      - uses: actions/upload-artifact@v4
        with:
          name: vmm-x86_64
          path: |
            target/vm/cloud-hypervisor
            target/vm/virtiofsd

  fetch-vmm-aarch64:
    needs: [ lint-macos, lint-linux, test-macos, test-linux ]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run fetch:cloud-hypervisor
      - run: mise run build:virtiofsd
      - uses: actions/upload-artifact@v4
        with:
          name: vmm-aarch64
          path: |
            target/vm/cloud-hypervisor
            target/vm/virtiofsd

  # The notifier app for all macOS CLI builds. One universal build, so all
  # CLI binaries contain the same signed app. Only push runs (main) get the
  # Developer ID signature. Pull request runs sign ad hoc and never touch the
  # signing secrets.
  # The notifier app for the macOS CLI binaries. Two jobs make it, and only
  # one of them runs. Push builds of main sign it with the Developer ID key
  # from the `macos-signing` environment. GitHub gives the environment
  # secrets only to main. All other builds sign it ad hoc and never read the
  # signing secrets. Both jobs upload the same artifact name.
  build-notifier-macos-signed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ lint-macos, lint-linux, test-macos, test-linux ]
    runs-on: macos-latest
    environment: macos-signing
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Import Developer ID certificate
        uses: ./.github/actions/import-signing-cert
        with:
          cert-b64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      # --force: build again also when the stamp of a cached build matches.
      - name: Build notifier app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTIFIER_BUNDLE_ID: io.github.milankinen.airlock.notify
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::Secret APPLE_SIGNING_IDENTITY is empty"
            exit 1
          fi
          NOTIFIER_UNIVERSAL=1 NOTIFIER_SIGN_ID="$APPLE_SIGNING_IDENTITY" mise run --force build:notifier
      - name: Clean up keychain
        if: always()
        uses: ./.github/actions/cleanup-signing-cert
      - name: Show signature
        run: |
          APP="target/notifier/AirlockNotifier.app"
          codesign --display --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/airlock-macos-notifier"
      - uses: actions/upload-artifact@v4
        with:
          name: notifier-macos
          path: target/vm/notifier.tar
          if-no-files-found: error

  build-notifier-macos:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [ lint-macos, lint-linux, test-macos, test-linux ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # --force: build again also when the stamp of a cached build matches.
      - name: Build notifier app (ad hoc)
        env:
          NOTIFIER_BUNDLE_ID: io.github.milankinen.airlock.notify
        run: NOTIFIER_UNIVERSAL=1 mise run --force build:notifier
      - name: Show signature
        run: |
          APP="target/notifier/AirlockNotifier.app"
          codesign --display --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/airlock-macos-notifier"
      - uses: actions/upload-artifact@v4
        with:
          name: notifier-macos
          path: target/vm/notifier.tar
          if-no-files-found: error

  # libkrun library for the macOS arm64 CLI. Same pattern as the notifier
  # app: pushes to main sign it with the Developer ID, because the hardened
  # runtime loads only libraries with the same Team ID. Other builds sign ad
  # hoc and never read the secrets. The cache holds no signed library.
  build-libkrun-macos-signed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ lint-macos, lint-linux, test-macos, test-linux ]
    runs-on: macos-latest
    environment: macos-signing
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/airlock-dev/libkrun
          key: libkrun-macos-aarch64-${{ hashFiles('mise/tasks/build/libkrun', 'app/vm-libkrun/*') }}
      - name: Import Developer ID certificate
        uses: ./.github/actions/import-signing-cert
        with:
          cert-b64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      # --force: build again also when the stamp of a cached build matches.
      - name: Build and sign libkrun
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::Secret APPLE_SIGNING_IDENTITY is empty"
            exit 1
          fi
          mise run --force build:libkrun
      - name: Clean up keychain
        if: always()
        uses: ./.github/actions/cleanup-signing-cert
      - name: Show signature
        run: |
          codesign --display --verbose=2 target/vm/libkrun.dylib
          lipo -info target/vm/libkrun.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: libkrun-macos
          path: target/vm/libkrun.dylib
          if-no-files-found: error

  build-libkrun-macos:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [ lint-macos, lint-linux, test-macos, test-linux ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/airlock-dev/libkrun
          key: libkrun-macos-aarch64-${{ hashFiles('mise/tasks/build/libkrun', 'app/vm-libkrun/*') }}
      - name: Build libkrun (ad hoc)
        run: mise run --force build:libkrun
      - name: Show signature
        run: |
          codesign --display --verbose=2 target/vm/libkrun.dylib
          lipo -info target/vm/libkrun.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: libkrun-macos
          path: target/vm/libkrun.dylib
          if-no-files-found: error

  # ── Stage 3: CLI binaries ──────────────────────────────
  build-cli-macos-aarch64:
    needs: [ build-kernel-aarch64, build-initramfs-aarch64, build-notifier-macos, build-notifier-macos-signed, build-libkrun-macos, build-libkrun-macos-signed ]
    # One of the two notifier jobs is always skipped. A skipped need skips
    # this job by default, so check the results here.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.build-notifier-macos.result == 'success' || needs.build-notifier-macos-signed.result == 'success') && (needs.build-libkrun-macos.result == 'success' || needs.build-libkrun-macos-signed.result == 'success') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install capnp
        run: brew install capnp
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: kernel-aarch64
          path: target/vm
      - uses: actions/download-artifact@v4
        with:
          name: initramfs-aarch64
          path: target/vm
      - uses: actions/download-artifact@v4
        with:
          name: notifier-macos
          path: target/vm
      - uses: actions/download-artifact@v4
        with:
          name: libkrun-macos
          path: target/vm
      - run: cargo build --release -p airlock-cli
      - run: codesign --entitlements entitlements.plist --force -s - target/release/airlock
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-macos-aarch64
          path: target/release/airlock

  build-cli-macos-x86_64:
    needs: [ build-kernel-x86_64, build-initramfs-x86_64, build-notifier-macos, build-notifier-macos-signed ]
    # One of the two notifier jobs is always skipped. A skipped need skips
    # this job by default, so check the results here.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.build-notifier-macos.result == 'success' || needs.build-notifier-macos-signed.result == 'success') }}
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install capnp
        run: brew install capnp
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64
          path: target/vm
      - uses: actions/download-artifact@v4
        with:
          name: initramfs-x86_64
          path: target/vm
      - uses: actions/download-artifact@v4
        with:
          name: notifier-macos
          path: target/vm
      - run: cargo build --release -p airlock-cli
      - run: codesign --entitlements entitlements.plist --force -s - target/release/airlock
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-macos-x86_64
          path: target/release/airlock

  build-cli-linux-x86_64:
    needs: [ build-kernel-x86_64, build-initramfs-x86_64, fetch-vmm-x86_64 ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # musl: a static binary runs also on distros without glibc
      - name: Install build deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq capnproto libcapnp-dev musl-tools
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64
          path: target/vm
      - uses: actions/download-artifact@v4
        with:
          name: initramfs-x86_64
          path: target/vm
      - uses: actions/download-artifact@v4
        with:
          name: vmm-x86_64
          path: target/vm
      - run: cargo build --release -p airlock-cli --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/airlock

  build-cli-linux-aarch64:
    needs: [ build-kernel-aarch64, build-initramfs-aarch64, fetch-vmm-aarch64 ]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # musl: a static binary runs also on distros without glibc
      - name: Install build deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq capnproto libcapnp-dev musl-tools
          rustup target add aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: kernel-aarch64
          path: target/vm
      - uses: actions/download-artifact@v4
        with:
          name: initramfs-aarch64
          path: target/vm
      - uses: actions/download-artifact@v4
        with:
          name: vmm-aarch64
          path: target/vm
      - run: cargo build --release -p airlock-cli --target aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-linux-aarch64
          path: target/aarch64-unknown-linux-musl/release/airlock

  # ── Stage 4: VM integration tests (bats) ───────────────
  test-e2e:
    needs: [ build-cli-linux-x86_64 ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: airlock-linux-x86_64
          path: .tmp/bin
      - name: Run VM bats tests
        run: |
          chmod +x .tmp/bin/airlock
          AIRLOCK_BIN="$(pwd)/.tmp/bin/airlock" bats tests/vm/

  # ── Stage 3b: distroless CLI binaries (no bundled kernel/initramfs) ────
  build-cli-macos-aarch64-distroless:
    needs: [ lint-macos, lint-linux, test-macos, test-linux, build-notifier-macos, build-notifier-macos-signed, build-libkrun-macos, build-libkrun-macos-signed ]
    # One of the two notifier jobs is always skipped. A skipped need skips
    # this job by default, so check the results here.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.build-notifier-macos.result == 'success' || needs.build-notifier-macos-signed.result == 'success') && (needs.build-libkrun-macos.result == 'success' || needs.build-libkrun-macos-signed.result == 'success') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install capnp
        run: brew install capnp
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: notifier-macos
          path: target/vm
      - uses: actions/download-artifact@v4
        with:
          name: libkrun-macos
          path: target/vm
      - run: cargo build --release -p airlock-cli --features distroless
      - run: codesign --entitlements entitlements.plist --force -s - target/release/airlock
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-macos-aarch64-distroless
          path: target/release/airlock

  build-cli-macos-x86_64-distroless:
    needs: [ lint-macos, lint-linux, test-macos, test-linux, build-notifier-macos, build-notifier-macos-signed ]
    # One of the two notifier jobs is always skipped. A skipped need skips
    # this job by default, so check the results here.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.build-notifier-macos.result == 'success' || needs.build-notifier-macos-signed.result == 'success') }}
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install capnp
        run: brew install capnp
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: notifier-macos
          path: target/vm
      - run: cargo build --release -p airlock-cli --features distroless
      - run: codesign --entitlements entitlements.plist --force -s - target/release/airlock
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-macos-x86_64-distroless
          path: target/release/airlock

  build-cli-linux-x86_64-distroless:
    needs: [ lint-macos, lint-linux, test-macos, test-linux, fetch-vmm-x86_64 ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # musl: a static binary runs also on distros without glibc
      - name: Install build deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq capnproto libcapnp-dev musl-tools
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: vmm-x86_64
          path: target/vm
      - run: cargo build --release -p airlock-cli --features distroless --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-linux-x86_64-distroless
          path: target/x86_64-unknown-linux-musl/release/airlock

  build-cli-linux-aarch64-distroless:
    needs: [ lint-macos, lint-linux, test-macos, test-linux, fetch-vmm-aarch64 ]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # musl: a static binary runs also on distros without glibc
      - name: Install build deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq capnproto libcapnp-dev musl-tools
          rustup target add aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: vmm-aarch64
          path: target/vm
      - run: cargo build --release -p airlock-cli --features distroless --target aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-linux-aarch64-distroless
          path: target/aarch64-unknown-linux-musl/release/airlock
