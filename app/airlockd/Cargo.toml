[package]
name = "airlockd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "airlockd"
path = "src/main.rs"

[features]
# In-VM TUN/smoltcp throughput benchmark (`tun_bench` tests). Needs root +
# CAP_NET_ADMIN to create TUN devices, so it is opt-in at compile time.
tun-bench = []

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
capnp = { workspace = true }
capnp-rpc = { workspace = true }
airlock-common = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
pty-process = { workspace = true }
quick_cache = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
scc = { workspace = true }
simple-dns = { workspace = true }
smoltcp = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "process", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry", "env-filter"] }
