# GitHub Copilot CLI preset
#
# API hosts from:
# https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment

[env]
# The real token stays on the host. The sandbox sees a random surrogate
# of the same length. The `inject` rule below puts the real value into the
# request headers at the host boundary.
COPILOT_GITHUB_TOKEN = { value = "${COPILOT_GITHUB_TOKEN}", mask = true }

# Injection covers each host that this rule allows, also the telemetry
# hosts under *.githubcopilot.com. The token leaves the host only in
# requests where Copilot itself put the surrogate.
[network.rules.copilot-cli]
inject = ["COPILOT_GITHUB_TOKEN"]
allow = [
    "github.com:443",
    "api.github.com:443",
    "*.githubcopilot.com:443",
]

[mounts.copilot-session]
source = "~/.airlock/copilot-cli"
target = "~/.copilot"
missing = "create-dir"
