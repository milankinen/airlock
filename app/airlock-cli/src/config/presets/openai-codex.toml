# OpenAI Codex development preset

[env]
# The real API key stays on the host. The sandbox sees a random surrogate
# of the same length. The `inject` rule below puts the real value into the
# request headers at the host boundary.
OPENAI_API_KEY = { value = "${OPENAI_API_KEY}", mask = true }

[network.rules.codex]
inject = ["OPENAI_API_KEY"]
allow = [
    "api.openai.com:443",
    "auth.openai.com:443",
]

[mounts.codex-dir]
source = "~/.airlock/codex"
target = "~/.codex"
missing = "create-dir"
