# Claude Code development preset

[env]
# The real token stays on the host. The sandbox sees a random surrogate
# of the same length. The `inject` rule below puts the real value into the
# request headers to the Anthropic API at the host boundary.
CLAUDE_CODE_OAUTH_TOKEN = { value = "${CLAUDE_CODE_OAUTH_TOKEN}", mask = true }

# The network rules do not allow the telemetry endpoints. Disable telemetry.
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"

# Tell Claude Code that it runs in a sandbox.
IS_SANDBOX = "1"
# Claude Code uses the Node.js trusted certificates. Add the airlock CA to them.
NODE_EXTRA_CA_CERTS = "/etc/ssl/certs/ca-certificates.crt"

[network.rules.claude-code]
inject = ["CLAUDE_CODE_OAUTH_TOKEN"]
allow = [
    "claude.ai:443",
    "downloads.claude.ai:443",
    "platform.claude.com:443",
    "api.anthropic.com:443",
]

[mounts.claude-settings]
missing = "create-dir"
source = "~/.airlock/claude/settings"
target = "~/.claude"

[mounts.claude-json]
missing = "create-file"
file_content = "{\"hasCompletedOnboarding\":true}"
source = "~/.airlock/claude/claude.json"
target = "~/.claude.json"
