# `docker` starts `dockerd` as a sidecar daemon and allows image pulls
# from Docker Hub and ghcr.io. `python` allows PyPI for `uv run` inside
# the app container.
presets = ["python", "docker"]

[vm]
image = "airlock-example:docker"

# Forward the Flask app's port so the host browser can reach
# http://localhost:8000 once `docker compose up` is running.
[network.ports.app]
guest = [8000]
