[tools]
"aqua:docker/cli" = "29.4.0"
"github:rust-lang/mdBook" = "0.5.2"
"aqua:bats-core/bats-core" = "1.11.1"

[tasks.test]
quiet = true
description = "Run Rust unit tests"
run = "cargo test --workspace"

[tasks.bats]
quiet = true
description = "Run all bats tests"
run = [{ task = "bats:cli" }, { task = "bats:vm" }]

[tasks."bats:cli"]
quiet = true
description = "Run CLI bats tests"
depends = ["build:release"]
run = "bats tests/cli/"

[tasks."bats:vm"]
quiet = true
description = "Run VM bats tests (requires KVM + docker)"
depends = ["build:release"]
run = "bats tests/vm/"

[tasks.format]
quiet = true
description = "Format all code"
run = "cargo +nightly fmt --all"

[tasks.lint]
quiet = true
description = "Lint all code"
run = """
cargo +nightly fmt --all -- --check
cargo clippy --workspace --tests -- -D warnings
"""

[tasks."docs:build"]
quiet = true
description = "Build documentation"
run = "mdbook build docs/manual"

[tasks."docs:serve"]
description = "Serve documentation with live reload"
raw = true
run = "mdbook serve docs/manual"

[tasks.dev]
description = "Build, sign, and run"
raw = true
dir = "{{ config_root }}/dev"
depends = ["build:dev", "build:dev-image"]
env.RUST_BACKTRACE = "1"
run = "exec ../target/debug/airlock"

[tasks.claude]
description = "Build, sign, and run"
quiet = true
raw = true
depends = ["build:dev", "build:dev-image"]
run = """
export GIT_AUTHOR_NAME="$(git config --get user.name)"
export GIT_AUTHOR_EMAIL="$(git config --get user.email)"
export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
exec target/debug/airlock start --monitor --login -- claude --dangerously-skip-permissions
"""

[tasks."network-bench-server"]
description = "Serve zero-filled payloads to benchmark VM network download speed"
raw = true
run = '''
port="${PORT:-8080}"
py="$(command -v python3 || command -v python)" || { echo "python3 not found on PATH" >&2; exit 1; }
"$py" -c '
import http.server as s, sys
port = int(sys.argv[1])
class H(s.BaseHTTPRequestHandler):
    def do_GET(self):
        mb = int(self.path.strip("/") or 1024); n = mb << 20
        self.send_response(200)
        self.send_header("Content-Type", "application/octet-stream")
        self.send_header("Content-Length", str(n))
        self.end_headers()
        chunk = bytes(1 << 20)
        try:
            for _ in range(mb): self.wfile.write(chunk)
        except BrokenPipeError:
            pass
    def log_message(self, *a): pass
print(f"network-bench-server on 0.0.0.0:{port} - GET /<MB> (default 1024)", file=sys.stderr)
s.ThreadingHTTPServer(("0.0.0.0", port), H).serve_forever()
' "$port"
'''

