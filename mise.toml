[tools]
"python" = "3.13"
"aqua:docker/cli" = "29.4.0"
"github:rust-lang/mdBook" = "0.5.2"
"aqua:bats-core/bats-core" = "1.11.1"

[env]
# Sandbox-only build locations (CARGO_TARGET_DIR, shared caches)
_.source = "{{ config_root }}/.claude/sandbox/env.sh"

[tasks.test]
quiet = true
description = "Run Rust unit tests"
run = "cargo test --workspace"

[tasks.bats]
quiet = true
description = "Run all bats tests"
run = [{ task = "bats:cli" }, { task = "bats:vm" }]

[tasks."bats:cli"]
quiet = true
description = "Run CLI bats tests"
depends = ["build:release"]
run = "bats tests/cli/"

[tasks."bats:vm"]
quiet = true
description = "Run VM bats tests (requires KVM + docker)"
depends = ["build:release"]
run = "bats tests/vm/"

[tasks.format]
quiet = true
description = "Format all code"
run = "cargo +nightly fmt --all"

[tasks.lint]
quiet = true
description = "Lint all code"
shell = "bash -c"
run = '''
set -euo pipefail
cargo +nightly fmt --all -- --check
cargo clippy --workspace --tests -- -D warnings

# The test build allows the file access bans, so lint the normal build of
# airlock-cli too. It embeds the VM assets: put empty files in place of the
# missing ones and remove them after the lint.
made=""
cleanup() { if [[ -n "$made" ]]; then rm -f $made; fi; }
trap cleanup EXIT
mkdir -p target/vm
for f in Image initramfs.gz cloud-hypervisor virtiofsd; do
  if [[ ! -e target/vm/$f ]]; then touch "target/vm/$f"; made="$made target/vm/$f"; fi
done
cargo clippy -p airlock-cli -- -D warnings
'''

[tasks."docs:build"]
quiet = true
description = "Build documentation"
run = "mdbook build docs/manual"

[tasks."docs:serve"]
description = "Serve documentation with live reload"
raw = true
run = "mdbook serve docs/manual"

[tasks.airlock]
description = "Build, sign, and run"
raw = true
dir = "{{ cwd }}"
depends = ["build:dev"]
run = "exec \"${CARGO_TARGET_DIR:-{{ config_root }}/target}/debug/airlock\""

[tasks."sandbox-start"]
description = "Build airlock and start the project sandbox shell"
raw = true
run = "mise airlock -- start"

[tasks."sandbox-setup"]
description = "Install sandbox build tooling (mold, kache) with an open network"
raw = true
run = "mise airlock -- start --network=allow-always --login -- .claude/sandbox/setup.sh"
